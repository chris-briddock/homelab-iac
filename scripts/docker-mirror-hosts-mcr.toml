# mcr.microsoft.com via the lab pull-through cache (the same registry VM the
# infra services use — see services.tf 50-docker-mirror.conf). Docker falls
# back to the real registry automatically when the mirror is unreachable.
#
# Install on the dev laptop:
#   sudo mkdir -p /etc/docker/certs.d/mcr.microsoft.com
#   sudo cp scripts/docker-mirror-hosts-mcr.toml /etc/docker/certs.d/mcr.microsoft.com/hosts.toml
#   sudo systemctl restart docker
server = "https://mcr.microsoft.com"

[host."https://registry.lab.internal/mcr.microsoft.com"]
  capabilities = ["pull", "resolve"]
